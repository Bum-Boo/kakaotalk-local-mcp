[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hermes-kakao-mcp"
version = "0.1.0"
description = "Fail-closed KakaoTalk PC bridge for Hermes MCP on Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bum-Boo" }]
dependencies = [
  "mcp>=1.20,<2",
  "cryptography>=46,<51",
  "pywin32>=311; sys_platform == 'win32'",
  "comtypes>=1.4,<2; sys_platform == 'win32'",
]

[project.optional-dependencies]
calendar = [
  "google-api-python-client>=2.194,<3",
  "google-auth>=2.55,<3",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
hermes-kakao-mcp = "hermes_kakao_mcp.cli:main"
hermes-kakao-watch = "hermes_kakao_mcp.watcher:main"
hermes-kakao-backend-watch = "hermes_kakao_mcp.backend_watcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_kakao_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
